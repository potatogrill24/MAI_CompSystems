name: Go and integration
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go test -race ./...
      - run: go vet ./...
      - run: docker compose up --build -d --wait --wait-timeout 300
      - run: python3 scripts/smoke.py
      - run: python3 scripts/recovery.py
      - if: failure()
        run: docker compose logs --no-color --tail 100
      - if: always()
        run: docker compose down
