{
  "apiVersion": "v1",
  "kind": "List",
  "items": [
    {
      "apiVersion": "apps/v1",
      "kind": "Deployment",
      "metadata": {
        "name": "management",
        "namespace": "mai-compsystems"
      },
      "spec": {
        "replicas": 1,
        "selector": {
          "matchLabels": {
            "app": "management"
          }
        },
        "template": {
          "metadata": {
            "labels": {
              "app": "management"
            }
          },
          "spec": {
            "terminationGracePeriodSeconds": 20,
            "securityContext": {
              "runAsNonRoot": true,
              "runAsUser": 10001
            },
            "containers": [
              {
                "name": "management",
                "image": "mai-compsystems:local",
                "imagePullPolicy": "IfNotPresent",
                "envFrom": [
                  {
                    "configMapRef": {
                      "name": "app-config"
                    }
                  },
                  {
                    "secretRef": {
                      "name": "app-secrets"
                    }
                  }
                ],
                "env": [
                  {
                    "name": "SERVICE",
                    "value": "management"
                  }
                ],
                "ports": [
                  {
                    "containerPort": 8080
                  }
                ],
                "readinessProbe": {
                  "httpGet": {
                    "path": "/readyz",
                    "port": 8080
                  },
                  "periodSeconds": 5
                },
                "livenessProbe": {
                  "httpGet": {
                    "path": "/healthz",
                    "port": 8080
                  },
                  "initialDelaySeconds": 10,
                  "periodSeconds": 10
                },
                "resources": {
                  "requests": {
                    "cpu": "100m",
                    "memory": "64Mi"
                  },
                  "limits": {
                    "cpu": "2",
                    "memory": "512Mi"
                  }
                },
                "securityContext": {
                  "allowPrivilegeEscalation": false,
                  "readOnlyRootFilesystem": true,
                  "capabilities": {
                    "drop": [
                      "ALL"
                    ]
                  }
                }
              }
            ]
          }
        }
      }
    },
    {
      "apiVersion": "v1",
      "kind": "Service",
      "metadata": {
        "name": "management",
        "namespace": "mai-compsystems"
      },
      "spec": {
        "selector": {
          "app": "management"
        },
        "ports": [
          {
            "port": 8080,
            "targetPort": 8080
          }
        ]
      }
    },
