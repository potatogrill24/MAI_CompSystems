{
  "apiVersion": "v1",
  "kind": "List",
  "items": [
    {
      "apiVersion": "v1",
      "kind": "PersistentVolumeClaim",
      "metadata": {
        "name": "postgres-data",
        "namespace": "mai-compsystems"
      },
      "spec": {
        "accessModes": [
          "ReadWriteOnce"
        ],
        "resources": {
          "requests": {
            "storage": "2Gi"
          }
        }
      }
    },
    {
      "apiVersion": "apps/v1",
      "kind": "Deployment",
      "metadata": {
        "name": "postgres",
        "namespace": "mai-compsystems"
      },
      "spec": {
        "replicas": 1,
        "strategy": {
          "type": "Recreate"
        },
        "selector": {
          "matchLabels": {
            "app": "postgres"
          }
        },
        "template": {
          "metadata": {
            "labels": {
              "app": "postgres"
            }
          },
          "spec": {
            "containers": [
              {
                "name": "postgres",
                "image": "postgres:17-alpine",
                "ports": [
                  {
                    "containerPort": 5432
                  }
                ],
                "volumeMounts": [
                  {
                    "name": "data",
                    "mountPath": "/var/lib/postgresql/data"
                  }
                ],
                "env": [
                  {
                    "name": "POSTGRES_USER",
                    "valueFrom": {
                      "secretKeyRef": {
                        "name": "app-secrets",
                        "key": "POSTGRES_USER"
                      }
                    }
                  },
                  {
                    "name": "POSTGRES_PASSWORD",
                    "valueFrom": {
                      "secretKeyRef": {
                        "name": "app-secrets",
                        "key": "POSTGRES_PASSWORD"
                      }
                    }
                  },
                  {
                    "name": "POSTGRES_DB",
                    "valueFrom": {
                      "secretKeyRef": {
                        "name": "app-secrets",
                        "key": "POSTGRES_DB"
                      }
                    }
                  }
                ],
                "readinessProbe": {
                  "tcpSocket": {
                    "port": 5432
                  },
                  "initialDelaySeconds": 5,
                  "periodSeconds": 5
                },
                "resources": {
                  "requests": {
                    "cpu": "100m",
                    "memory": "128Mi"
                  },
                  "limits": {
                    "memory": "1Gi"
                  }
                }
              }
            ],
            "volumes": [
              {
                "name": "data",
                "persistentVolumeClaim": {
                  "claimName": "postgres-data"
                }
              }
            ]
          }
        }
      }
    },
    {
      "apiVersion": "v1",
      "kind": "Service",
      "metadata": {
        "name": "postgres",
        "namespace": "mai-compsystems"
      },
      "spec": {
        "selector": {
          "app": "postgres"
        },
        "ports": [
          {
            "port": 5432,
            "targetPort": 5432
          }
        ]
      }
    },
    {
